<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --field-a: #fffaf0;
      --field-b: #e8fbff;
      --field-c: #fff0f4;
      --aurora-a: #ffcf4a;
      --aurora-b: #ff5f9b;
      --aurora-c: #4fd7ff;
      --prism-a: #13c9e8;
      --prism-b: #7860ff;
      --prism-c: #f44e98;
      --prism-d: #f0b72f;
      --page-a: rgba(255, 255, 255, 0.74);
      --page-b: rgba(244, 254, 255, 0.5);
      --page-c: rgba(255, 246, 223, 0.6);
      --frame: rgba(0, 0, 0, 0.1);
      --cast: rgba(48, 66, 103, 0.18);
      --symbol: #ffffff;
      --symbol-stroke: rgba(255, 255, 255, 0.88);
      --sun-opacity: 1;
      --moon-opacity: 0;
