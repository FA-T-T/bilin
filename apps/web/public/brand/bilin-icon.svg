        --field-a: #06111f;
        --field-b: #18143e;
        --field-c: #341331;
        --aurora-a: #29f0ff;
        --aurora-b: #a575ff;
        --aurora-c: #ff64c7;
        --prism-a: #48f4ff;
        --prism-b: #8d7bff;
        --prism-c: #ff68c9;
        --prism-d: #ffd15b;
        --page-a: rgba(255, 255, 255, 0.13);
        --page-b: rgba(78, 244, 255, 0.13);
        --page-c: rgba(255, 104, 201, 0.15);
        --frame: rgba(255, 255, 255, 0.2);
        --cast: rgba(0, 0, 0, 0.36);
        --symbol: #fff7cc;
        --symbol-stroke: rgba(255, 241, 183, 0.94);
        --sun-opacity: 0;
        --moon-opacity: 1;
      }
    }

    .sun {
      opacity: var(--sun-opacity);
    }

    .moon {
      opacity: var(--moon-opacity);
    }
